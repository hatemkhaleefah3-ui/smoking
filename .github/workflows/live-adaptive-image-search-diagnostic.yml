name: Live adaptive image search diagnostic

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose-provider-resilience:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Wait for exact commit on production
        env:
          EXPECTED_SHA: ${{ github.sha }}
          DEPLOYMENT_URL: https://smoking-e1j.pages.dev/api/diagnostics/9c593829f5c04b3e9ffb86724c4c3b75/deployment
        run: |
          node --input-type=module <<'NODE'
          const expected = process.env.EXPECTED_SHA;
          const url = process.env.DEPLOYMENT_URL;
          for (let attempt = 1; attempt <= 40; attempt += 1) {
            try {
              const response = await fetch(`${url}?attempt=${attempt}&ts=${Date.now()}`, {
                headers: { 'Cache-Control': 'no-cache' }
              });
              const body = await response.json();
              console.log(`attempt=${attempt} status=${response.status} deployed=${body.deploymentCommitSha || 'missing'} expected=${expected}`);
              if (response.ok && body.deploymentCommitSha === expected) process.exit(0);
            } catch (error) {
              console.log(`attempt=${attempt} error=${error.message}`);
            }
            await new Promise((resolve) => setTimeout(resolve, 15000));
          }
          process.exit(1);
          NODE

      - name: Run live Heart and glycine resilience diagnostics
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { writeFile } from 'node:fs/promises';

          const endpoint = 'https://smoking-e1j.pages.dev/api/image-search';

          const post = async (body, timeoutMs = 20_000) => {
            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), timeoutMs);
            const startedAt = Date.now();
            try {
              const response = await fetch(`${endpoint}?ts=${Date.now()}`, {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'Cache-Control': 'no-cache'
                },
                signal: controller.signal,
                body: JSON.stringify(body)
              });
              const text = await response.text();
              let payload;
              try { payload = JSON.parse(text); } catch { payload = { parseError: true, rawBody: text }; }
              return { status: response.status, durationMs: Date.now() - startedAt, payload };
            } finally {
              clearTimeout(timeout);
            }
          };

          const heart = await post({ query: 'Heart', debug: true, retry: true });
          const ambiguity = await post({ query: 'glycine', debug: true, retry: true });
          const nutritionTopic = ambiguity.payload?.topics?.find((topic) => topic.id === 'nutrition-metabolism') || null;
          const nutrition = await post({
            query: 'glycine',
            topic: nutritionTopic,
            debug: true,
            retry: true,
            excludeUrls: []
          });

          const output = { heart, ambiguity, nutritionTopic, nutrition };
          await writeFile(
            'live-adaptive-image-search-diagnostic.json',
            `${JSON.stringify(output, null, 2)}\n`,
            'utf8'
          );

          const summary = (result) => ({
            status: result.status,
            durationMs: result.durationMs,
            requiresTopic: result.payload?.requiresTopic,
            resultCount: result.payload?.resultCount,
            externalQuery: result.payload?.externalQuery,
            sourceStatus: result.payload?.sourceStatus
          });
          console.log('Heart summary', JSON.stringify(summary(heart), null, 2));
          console.log('Glycine ambiguity summary', JSON.stringify({
            status: ambiguity.status,
            durationMs: ambiguity.durationMs,
            topics: ambiguity.payload?.topics?.map((topic) => topic.id) || []
          }, null, 2));
          console.log('Nutrition summary', JSON.stringify(summary(nutrition), null, 2));

          assert.equal(heart.status, 200);
          assert.equal(heart.payload.requiresTopic, false);
          assert.ok(heart.durationMs < 20_000, 'Heart search must finish before the client maximum wait.');
          const heartSource = (name) => heart.payload.sourceStatus.find((item) => item.source === name);
          assert.ok(heartSource('wikimedia')?.ok, 'Wikimedia must complete for Heart.');
          assert.ok(heartSource('wikimedia')?.count > 0, 'Wikimedia must return Heart images.');
          assert.ok(heartSource('openverse'), 'Openverse status must be present.');
          const heartNlm = heartSource('nlm-open-i');
          assert.ok(heartNlm, 'NLM Open-i status must be present.');
          assert.ok(
            heartNlm.ok || heartNlm.skipped,
            'NLM Open-i must either return results or expose a soft skipped-provider state.'
          );
          if (heartNlm.skipped) assert.match(heartNlm.message || '', /showing other sources/i);
          if (heartNlm.timedOut) assert.match(heartNlm.message || '', /timed out/i);

          assert.equal(ambiguity.status, 200);
          assert.equal(ambiguity.payload.requiresTopic, true);
          assert.ok(ambiguity.payload.topics.some((topic) => topic.id === 'nutrition-metabolism'));
          assert.equal(nutritionTopic?.id, 'nutrition-metabolism');

          assert.equal(nutrition.status, 200);
          assert.equal(nutrition.payload.requiresTopic, false);
          assert.ok(nutrition.durationMs < 20_000, 'Nutrition search must not leave the UI spinning.');
          const nutritionSource = (name) => nutrition.payload.sourceStatus.find((item) => item.source === name);
          assert.ok(nutritionSource('wikimedia')?.ok, 'Wikimedia must complete for glycine metabolism.');
          assert.ok(nutritionSource('wikimedia')?.count > 0, 'Wikimedia must recover or directly return glycine images.');
          const nutritionNlm = nutritionSource('nlm-open-i');
          assert.ok(nutritionNlm, 'NLM Open-i status must be present.');
          assert.ok(
            nutritionNlm.ok || nutritionNlm.skipped,
            'NLM Open-i must either return results or expose a soft skipped-provider state.'
          );
          if (nutritionNlm.skipped) assert.match(nutritionNlm.message || '', /showing other sources/i);
          if (nutritionNlm.timedOut) assert.match(nutritionNlm.message || '', /timed out/i);
          NODE

      - name: Upload adaptive diagnostic JSON
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: live-adaptive-image-search-diagnostic
          path: live-adaptive-image-search-diagnostic.json
          if-no-files-found: error
