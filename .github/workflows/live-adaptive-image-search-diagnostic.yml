name: Live adaptive image search diagnostic

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose-data-driven-search:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Wait for exact commit on production
        env:
          EXPECTED_SHA: ${{ github.sha }}
          DEPLOYMENT_URL: https://smoking-e1j.pages.dev/api/diagnostics/9c593829f5c04b3e9ffb86724c4c3b75/deployment
        run: |
          node --input-type=module <<'NODE'
          const expected = process.env.EXPECTED_SHA;
          const url = process.env.DEPLOYMENT_URL;
          for (let attempt = 1; attempt <= 40; attempt += 1) {
            try {
              const response = await fetch(`${url}?attempt=${attempt}&ts=${Date.now()}`, {
                headers: { 'Cache-Control': 'no-cache' }
              });
              const body = await response.json();
              console.log(`attempt=${attempt} status=${response.status} deployed=${body.deploymentCommitSha || 'missing'} expected=${expected}`);
              if (response.ok && body.deploymentCommitSha === expected) process.exit(0);
            } catch (error) {
              console.log(`attempt=${attempt} error=${error.message}`);
            }
            await new Promise((resolve) => setTimeout(resolve, 15000));
          }
          process.exit(1);
          NODE

      - name: Run live broad-pool and keyword diagnostics
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { writeFile } from 'node:fs/promises';

          const endpoint = 'https://smoking-e1j.pages.dev/api/image-search';
          const post = async (body, timeoutMs = 18_000) => {
            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), timeoutMs);
            const startedAt = Date.now();
            try {
              const response = await fetch(`${endpoint}?ts=${Date.now()}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Cache-Control': 'no-cache' },
                signal: controller.signal,
                body: JSON.stringify(body)
              });
              const text = await response.text();
              let payload;
              try { payload = JSON.parse(text); } catch { payload = { parseError: true, rawBody: text }; }
              return { status: response.status, durationMs: Date.now() - startedAt, payload };
            } finally {
              clearTimeout(timeout);
            }
          };

          const heartInitial = await post({ query: 'Heart', debug: true, retry: true });
          const heartKeyword = Array.isArray(heartInitial.payload?.keywordOptions)
            ? heartInitial.payload.keywordOptions[0] || null
            : null;
          const heartSelected = heartKeyword
            ? await post({ query: 'Heart', keyword: heartKeyword, debug: true })
            : heartInitial;

          const glycineInitial = await post({ query: 'glycine', debug: true, retry: true });
          const glycineKeyword = Array.isArray(glycineInitial.payload?.keywordOptions)
            ? glycineInitial.payload.keywordOptions.find((item) => /metabol/i.test(`${item.keyword} ${item.label}`))
              || glycineInitial.payload.keywordOptions[0]
              || null
            : null;
          const glycineSelected = glycineKeyword
            ? await post({ query: 'glycine', keyword: glycineKeyword, debug: true })
            : glycineInitial;

          const output = { heartInitial, heartKeyword, heartSelected, glycineInitial, glycineKeyword, glycineSelected };
          await writeFile('live-adaptive-image-search-diagnostic.json', `${JSON.stringify(output, null, 2)}\n`, 'utf8');

          const summary = (result) => ({
            status: result.status,
            durationMs: result.durationMs,
            requiresKeyword: result.payload?.requiresKeyword,
            keywordCount: result.payload?.keywordOptions?.length || 0,
            resultCount: result.payload?.resultCount,
            poolResultCount: result.payload?.poolResultCount,
            filter: result.payload?.filter,
            sourceStatus: result.payload?.sourceStatus
          });
          console.log('Heart initial', JSON.stringify(summary(heartInitial), null, 2));
          console.log('Heart selected', JSON.stringify(summary(heartSelected), null, 2));
          console.log('Glycine initial', JSON.stringify(summary(glycineInitial), null, 2));
          console.log('Glycine selected', JSON.stringify(summary(glycineSelected), null, 2));

          for (const [name, result] of [
            ['Heart initial', heartInitial],
            ['Heart selected', heartSelected],
            ['Glycine initial', glycineInitial],
            ['Glycine selected', glycineSelected]
          ]) {
            assert.equal(result.status, 200, `${name} must return HTTP 200.`);
            assert.ok(result.durationMs < 18_000, `${name} must finish before the client maximum wait.`);
            assert.equal(result.payload.requiresTopic, false, `${name} must not use static Wikidata topics.`);
            assert.ok(Array.isArray(result.payload.sourceStatus), `${name} must expose source status.`);
            const nlm = result.payload.sourceStatus.find((item) => item.source === 'nlm-open-i');
            assert.ok(nlm, `${name} must include NLM Open-i status.`);
            assert.ok(nlm.ok || nlm.skipped, `${name} must either use or softly skip NLM Open-i.`);
            if (nlm.skipped) assert.match(nlm.message || '', /showing other sources/i);
          }

          const heartWikimedia = heartInitial.payload.sourceStatus.find((item) => item.source === 'wikimedia');
          assert.ok(heartWikimedia?.ok && heartWikimedia.count > 0, 'Wikimedia must return broad Heart results.');
          assert.ok(heartInitial.payload.poolResultCount > 0, 'Heart broad pool must contain images.');
          assert.ok(heartSelected.payload.resultCount > 0, 'A generated Heart keyword must not dead-end.');
          assert.ok(glycineInitial.payload.poolResultCount > 0, 'Glycine broad pool must contain images.');
          assert.ok(glycineSelected.payload.resultCount > 0, 'A generated glycine keyword must not dead-end.');

          if (heartInitial.payload.requiresKeyword) {
            assert.ok(heartInitial.payload.keywordOptions.length >= 2);
            assert.ok(!heartInitial.payload.keywordOptions.some((item) => item.keyword === 'human' && Number(item.overlapRatio || 0) > 0.75), 'Generic high-overlap Human should not be offered.');
          }
          if (heartKeyword) {
            assert.ok(heartSelected.payload.keywordOptions.some((item) => item.keyword === heartKeyword.keyword), 'Selected keyword must remain in the option set.');
          }
          NODE

      - name: Upload adaptive diagnostic JSON
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: live-adaptive-image-search-diagnostic
          path: live-adaptive-image-search-diagnostic.json
          if-no-files-found: error
