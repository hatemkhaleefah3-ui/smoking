name: Live adaptive image search diagnostic

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose-data-driven-search:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Wait for exact commit on production
        env:
          EXPECTED_SHA: ${{ github.sha }}
          DEPLOYMENT_URL: https://smoking-e1j.pages.dev/api/diagnostics/9c593829f5c04b3e9ffb86724c4c3b75/deployment
        run: |
          node --input-type=module <<'NODE'
          const expected = process.env.EXPECTED_SHA;
          const url = process.env.DEPLOYMENT_URL;
          for (let attempt = 1; attempt <= 40; attempt += 1) {
            try {
              const response = await fetch(`${url}?attempt=${attempt}&ts=${Date.now()}`, {
                headers: { 'Cache-Control': 'no-cache' }
              });
              const body = await response.json();
              console.log(`attempt=${attempt} status=${response.status} deployed=${body.deploymentCommitSha || 'missing'} expected=${expected}`);
              if (response.ok && body.deploymentCommitSha === expected) process.exit(0);
            } catch (error) {
              console.log(`attempt=${attempt} error=${error.name}: ${error.message}`);
            }
            await new Promise((resolve) => setTimeout(resolve, 15000));
          }
          process.exit(1);
          NODE

      - name: Run live provider and pipeline diagnostics
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { writeFile } from 'node:fs/promises';

          const endpoint = 'https://smoking-e1j.pages.dev/api/image-search';
          const post = async (body, timeoutMs = 18_000) => {
            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), timeoutMs);
            const startedAt = Date.now();
            try {
              const response = await fetch(`${endpoint}?ts=${Date.now()}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Cache-Control': 'no-cache' },
                signal: controller.signal,
                body: JSON.stringify(body)
              });
              const text = await response.text();
              let payload;
              try { payload = JSON.parse(text); } catch { payload = { parseError: true, rawBody: text }; }
              return { status: response.status, durationMs: Date.now() - startedAt, payload };
            } finally {
              clearTimeout(timeout);
            }
          };

          const heartInitial = await post({ query: 'Heart', debug: true, retry: true });
          const heartKeyword = Array.isArray(heartInitial.payload?.keywordOptions)
            ? heartInitial.payload.keywordOptions[0] || null
            : null;
          const heartSelected = heartKeyword
            ? await post({ query: 'Heart', keyword: heartKeyword, debug: true, retry: true })
            : heartInitial;

          const glycineInitial = await post({ query: 'glycine', debug: true, retry: true });
          const glycineKeyword = Array.isArray(glycineInitial.payload?.keywordOptions)
            ? glycineInitial.payload.keywordOptions.find((item) => /metabol/i.test(`${item.keyword} ${item.label}`))
              || glycineInitial.payload.keywordOptions[0]
              || null
            : null;
          const glycineSelected = glycineKeyword
            ? await post({ query: 'glycine', keyword: glycineKeyword, debug: true, retry: true })
            : glycineInitial;

          const output = { heartInitial, heartKeyword, heartSelected, glycineInitial, glycineKeyword, glycineSelected };
          await writeFile('live-adaptive-image-search-diagnostic.json', `${JSON.stringify(output, null, 2)}\n`, 'utf8');

          const results = [
            ['Heart initial', heartInitial],
            ['Heart selected', heartSelected],
            ['Glycine initial', glycineInitial],
            ['Glycine selected', glycineSelected]
          ];

          for (const [name, result] of results) {
            assert.equal(result.status, 200, `${name} must return HTTP 200.`);
            assert.ok(result.durationMs < 18_000, `${name} must finish before the client maximum wait.`);
            assert.equal(result.payload.requiresTopic, false, `${name} must not use static Wikidata topics.`);
            assert.ok(Array.isArray(result.payload.sourceStatus), `${name} must expose source status.`);

            const debug = result.payload.debugDiagnostics;
            assert.equal(debug?.version, 'part0-v1', `${name} must expose the Part 0 diagnostic schema.`);
            assert.equal(debug?.cache?.liveProviderRequests, true, `${name} must use live provider requests in debug mode.`);
            assert.ok(Array.isArray(debug?.providers), `${name} must expose provider attempts.`);

            const attemptedSources = new Set(debug.providers.map((item) => item.source));
            for (const source of ['wikimedia', 'openverse', 'nlm-open-i']) {
              assert.ok(attemptedSources.has(source), `${name} must include a ${source} provider attempt.`);
            }

            for (const attempt of debug.providers) {
              assert.match(attempt.requestUrl || '', /^https:\/\//, `${name}/${attempt.source} must expose the exact request URL.`);
              assert.equal(typeof attempt.fetchThrew, 'boolean', `${name}/${attempt.source} must report whether fetch threw.`);
              assert.ok(Object.hasOwn(attempt, 'responseStatus'), `${name}/${attempt.source} must expose raw HTTP status.`);
              assert.ok(Object.hasOwn(attempt, 'responseOk'), `${name}/${attempt.source} must expose response.ok.`);
              assert.equal(typeof attempt.rawBodyPreview, 'string', `${name}/${attempt.source} must expose a response body preview.`);
              assert.ok(Object.hasOwn(attempt, 'parsedResultCount'), `${name}/${attempt.source} must expose raw parsed count.`);
              assert.ok(Object.hasOwn(attempt, 'afterProviderFilterCount'), `${name}/${attempt.source} must expose post-provider-filter count.`);
              if (attempt.fetchThrew) {
                assert.ok(attempt.fetchErrorName, `${name}/${attempt.source} fetch exception must retain its JS error name.`);
                assert.ok(attempt.fetchErrorMessage, `${name}/${attempt.source} fetch exception must retain its JS error message.`);
              }
            }

            const pipeline = debug.pipeline;
            assert.ok(pipeline && typeof pipeline === 'object', `${name} must expose pipeline counts.`);
            assert.deepEqual(Object.keys(pipeline.rawByProvider || {}).sort(), ['nlm-open-i', 'openverse', 'wikimedia']);
            assert.deepEqual(Object.keys(pipeline.afterProviderFilteringByProvider || {}).sort(), ['nlm-open-i', 'openverse', 'wikimedia']);
            for (const field of [
              'beforeCrossProviderDedup',
              'afterCrossProviderDedup',
              'afterKeywordFiltering',
              'afterFeedbackRankingOrDemotion',
              'finalCountPassedToRender',
              'finalDomRenderedCount'
            ]) {
              assert.ok(Object.hasOwn(pipeline, field), `${name} must expose ${field}.`);
            }
            assert.ok(pipeline.beforeCrossProviderDedup >= pipeline.afterCrossProviderDedup, `${name} dedup count must not increase.`);

            if (result.payload.requiresKeyword) {
              assert.equal(pipeline.finalCountPassedToRender, 0, `${name} keyword gate must pass zero cards to render.`);
            } else {
              assert.equal(pipeline.finalCountPassedToRender, result.payload.resultCount, `${name} server render count must match resultCount.`);
            }

            for (const item of result.payload.sourceStatus) {
              if (!item.ok) {
                assert.ok(['network', 'timeout', 'http', 'parse', 'other'].includes(item.failureType), `${name}/${item.source} must classify its failure.`);
                if (item.failureType === 'network') assert.match(item.message || '', /no response/i);
                if (item.failureType === 'timeout') assert.match(item.message || '', /timed out/i);
                if (item.failureType === 'http') assert.match(item.message || '', /server returned/i);
              }
            }
          }

          console.log('Heart diagnostics', JSON.stringify(heartInitial.payload.debugDiagnostics, null, 2));
          console.log('Glycine diagnostics', JSON.stringify(glycineInitial.payload.debugDiagnostics, null, 2));
          NODE

      - name: Upload adaptive diagnostic JSON
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: live-adaptive-image-search-diagnostic
          path: live-adaptive-image-search-diagnostic.json
          if-no-files-found: error