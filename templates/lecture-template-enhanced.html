<!doctype html><html lang="{{LANGUAGE}}" dir="{{DIRECTION}}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="{{META_DESCRIPTION}}"><title>{{DOCUMENT_TITLE}}</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet"><style>

comparison-block,.columns-block,.formula-block{margin:24px 0}.step-item,.timeline-item{display:grid;grid-template-columns:42px 1fr;gap:13px;margin:12px 0;padding:15px;border:1px solid var(--line);border-radius:12px}.step-item>span{display:grid;width:35px;height:35px;place-items:center;border-radius:50%;color:white;background:var(--accent);font-weight:800}.step-item p,.timeline-item p{margin:4px 0 0}.timeline-item{grid-template-columns:100px 1fr}.timeline-item time{color:var(--accent);font-weight:800}.comparison-head,.comparison-row{display:grid;grid-template-columns:minmax(90px,.7fr) 1fr 1fr}.comparison-head>* ,.comparison-row>*{padding:11px;border:1px solid var(--line)}.comparison-head{background:var(--pale)}.columns-block{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px}.column-card{padding:18px;border:1px solid var(--line);border-radius:13px;background:#f8fafc}.formula-block{padding:20px;text-align:center;border:1px dashed var(--accent);border-radius:13px;background:var(--pale)}.formula-block div{margin:8px 0;font:700 1.35rem ui-monospace,monospace}.glossary-block dl{margin:0}.glossary-block dl div{padding:13px 0;border-bottom:1px solid var(--line)}dt{font-weight:800;color:var(--accent)}dd{margin:3px 0 0}.block-divider{margin:34px 0;border:0;border-top:1px solid var(--line)}.footer{padding:24px;text-align:center;color:var(--muted);font-size:.78rem}@media(max-width:820px){.layout{grid-template-columns:1fr}.sidebar{position:static}.toc{display:none}.hero{padding:48px 24px}.timeline-item{grid-template-columns:1fr}.comparison-head,.comparison-row{grid-template-columns:1fr}.comparison-head>*:first-child{display:none}}@media print{body{background:white}.sidebar{display:none}.layout{display:block;padding:0}.hero{padding:35px}.summary,.objectives-section,.references-section,.glossary-block,.lecture-section{box-shadow:none;break-inside:avoid}}
